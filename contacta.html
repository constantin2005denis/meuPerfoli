<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El meu portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formulari.css">
</head>

<body>
    <!-- Cabecera de la página -->
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Inici</a></li>
                <li><a href="sobre_mi.html">Sobre mi</a></li>
                <li><a href="Estudis.html">Estudis</a></li>
                <li><a href="contacta.html">contacta</a></li>
            </ul>
        </nav>

        <h1>Residència de desenvolupadors</h1>
        <p>Omple les teves dades i el teu perfil tècnic.</p>
    </header>

    <!-- Contenido principal -->
    <div class="contingut-principal">

        <form class="form-contacte" action="#" method="post">

            <!-- BLOC 1: DADES PERSONALS -->
            <fieldset>
                <legend>Dades personals</legend>

                <label for="nom">Nom i cognoms</label>
                <input type="text" id="nom" name="nom" required>

                <label for="email">Correu electrònic</label>
                <input type="email" id="email" name="email" required>

                <label for="telefon">Telèfon</label>
                <input type="tel" id="telefon" name="telefon" placeholder="9 xifres" pattern="[0-9]{9}">

                <label for="naixement">Data de naixement</label>
                <input type="date" id="naixement" name="naixement" required>

                <label for="pais">País</label>
                <select id="pais" name="pais" required>
                    <option value="">Tria un país</option>
                    <optgroup label="Europa">
                        <option value="es">Espanya</option>
                        <option value="fr">França</option>
                        <option value="it">Itàlia</option>
                        <option value="ro">Romania</option>
                    </optgroup>
                    <optgroup label="Amèrica">
                        <option value="mx">Mèxic</option>
                        <option value="ar">Argentina</option>
                        <option value="us">Estats Units</option>
                    </optgroup>
                </select>

                <label for="ciutat">Ciutat</label>
                <input type="text" id="ciutat" name="ciutat">
            </fieldset>

            <!-- BLOC 2: PERFIL TÈCNIC -->
            <fieldset>
                <legend>Perfil tècnic</legend>

                <label for="experiencia">Anys d'experiència</label>
                <input type="range" id="experiencia" name="experiencia" min="0" max="20" step="1" value="2">

                <fieldset>
                    <legend>Llenguatges que domines</legend>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="html"> HTML</label>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="css"> CSS</label>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="js"> JavaScript</label>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="php"> PHP</label>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="python"> Python</label>
                    <label class="opcio"><input type="checkbox" name="llenguatges" value="java"> Java</label>
                </fieldset>

                <fieldset>
                    <legend>Nivell d'anglès</legend>
                    <label class="opcio"><input type="radio" name="angles" value="A2"> A2</label>
                    <label class="opcio"><input type="radio" name="angles" value="B1"> B1</label>
                    <label class="opcio"><input type="radio" name="angles" value="B2"> B2</label>
                    <label class="opcio"><input type="radio" name="angles" value="C1"> C1</label>
                </fieldset>

                <label for="rols">Rols preferits</label>
                <select id="rols" name="rols" multiple size="4">
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="devops">DevOps</option>
                    <option value="dades">Dades</option>
                </select>

                <label for="github">URL de GitHub</label>
                <input type="url" id="github" name="github" placeholder="https://github.com/usuari">
            </fieldset>

            <!-- BOTONS -->
            <div class="botons">
                <button type="reset" class="btn-secundari">Esborra-ho tot</button>
                <button type="submit" class="btn-primari">Envia</button>
            </div>
        </form>

    </div>

    <!-- Pié de página -->
    <footer> &copy; 2026 Denis Constantin Irimia Tots els drets reservats</footer>
</body>

</html>
